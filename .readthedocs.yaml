# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
    nodejs: "22"
  commands:
    # Install Python dependencies via uv, creating .venv at the repo root
    # (myst.yml's marimo plugin path, ../.venv/bin/jupyter-book-marimo, expects it there)
    - UV_PROJECT_ENVIRONMENT=.venv uv sync
    # Install mystmd
    - npm install -g mystmd
    # Build the site (myst.yml lives in docs/, so build from there)
    - cd docs && UV_PROJECT_ENVIRONMENT=.venv uv run jupyter-book build --html
    # Copy the output to Read the Docs expected location
    - mkdir -p "$READTHEDOCS_OUTPUT/html/"
    - cd docs && cp -r _build/html/. "$READTHEDOCS_OUTPUT/html/"
    # Clean up build artifacts
    - cd docs && rm -rf _build

python:
  install:
    - method: uv
      command: sync
